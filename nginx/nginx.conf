# The gateway: the only container the internet can reach.
# Runs on Docker's official nginx image, which already ships the ACME module that
# gets and renews the HTTPS certificate in production (https.conf.template).
load_module modules/ngx_http_acme_module.so;

worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  access_log /var/log/nginx/access.log;
  server_tokens off;

  # Docker's built-in DNS server. nginx uses it to find the services by name, to find
  # them again when a container restarts with a new IP, and to reach Let's Encrypt.
  resolver 127.0.0.11 valid=10s;

  # Our responses are JSON. text/html is always compressed; this adds JSON.
  gzip on;
  gzip_types application/json;

  # WebSocket upgrade. "Upgrade" and "Connection" are hop-by-hop headers, so nginx
  # doesn't pass them on by itself. $connection_upgrade is "upgrade" when the client
  # asked for one, otherwise "close" (nginx's default for proxied requests).
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # One group per service. "resolve" re-checks the address in Docker's DNS, so a
  # restarted container is found at its new IP; it needs the shared "zone".
  upstream auth_service {
    zone upstreams 64k;
    server auth-service:4001 resolve;
  }
  upstream conversation_service {
    zone upstreams;
    server conversation-service:4002 resolve;
  }
  upstream message_service {
    zone upstreams;
    server message-service:4003 resolve;
  }

  # gateway.conf is generated at start from a template in /etc/nginx/templates:
  # http.conf.template locally and in CI, https.conf.template in production.
  include /etc/nginx/conf.d/gateway.conf;
}
