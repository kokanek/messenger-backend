# Routes, shared by the local (HTTP) and production (HTTPS) server blocks.

# Headers for every proxied request. Set once here: nginx drops these if a location
# sets any proxy_set_header of its own, so no location below does.
proxy_set_header Host $host;
proxy_set_header X-Request-Id $request_id;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Regular-expression locations win over prefix locations, so the message and read
# routes reach message-service even though they start with /api/conversations/.
location ~ ^/api/conversations/[^/]+/(messages|read)$ {
  proxy_pass http://message_service;
}

location = /ws {
  proxy_pass http://message_service;
}

location = /api/conversations {
  proxy_pass http://conversation_service;
}

location /api/conversations/ {
  proxy_pass http://conversation_service;
}

location /api/auth/ {
  proxy_pass http://auth_service;
}

location = /api/users {
  proxy_pass http://auth_service;
}

# Public health check for the uptime monitor outside the VM (Grafana Synthetic Monitoring).
# message-service's /ready checks Postgres and Redis, the path every message takes.
location = /api/health {
  proxy_pass http://message_service/ready;
}

# Anything else, /internal/* and /metrics included, never reaches a service.
location / {
  return 404;
}
